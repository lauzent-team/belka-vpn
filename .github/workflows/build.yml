name: Build SleePhy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Attaching the installer to a release needs write access to contents; the
# default token is read-only on some repositories.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run end-to-end tests
        run: node test/e2e.js

      - name: Build the Windows installer
        # --publish never: the release step below attaches the files, and
        # electron-builder would otherwise try to publish on its own.
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleePhy-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: Attach the installer to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
          # Notes are written by hand on the release, and generating them here
          # needs a permission scope the default token does not have.
          generate_release_notes: false
          fail_on_unmatched_files: true
